repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3  # keep in lockstep with the ruff pin in pyproject.toml
    hooks:
      - id: ruff
        args: [--no-fix]  # Only check, don't auto-fix
      - id: ruff-format
        args: [--check]  # Only check formatting, don't auto-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1  # keep in lockstep with the mypy pin in pyproject.toml
    hooks:
      - id: mypy
        # pre-commit runs hook commands from the repo root too, so this must
        # be backend/pyproject.toml, not pyproject.toml.
        args: [--config-file=backend/pyproject.toml]
        # pre-commit resolves `files:` against repo-root-relative paths, not
        # this config's own directory — must be backend/app/, not app/, or
        # this hook silently matches zero files.
        files: ^backend/app/.*\.py$
        additional_dependencies: [
          "fastapi==0.141.1",
          "sqlalchemy>=2.0.51",
          "pydantic>=2.0",
          "pyjwt[crypto]>=2.13.0",
          "pwdlib[bcrypt]==0.3.1",
          "python-multipart==0.0.32",
        ]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-json
        exclude: 'tsconfig.*\.json$'  # Exclude tsconfig files which allow comments
      - id: check-merge-conflict
      - id: check-toml
      - id: debug-statements
      - id: mixed-line-ending
