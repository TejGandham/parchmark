name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  ui-tests:
    runs-on: ubuntu-latest
    name: UI Tests

    steps:
      - name: Checkout code
        uses: https://code.forgejo.org/actions/checkout@v4

      - name: Setup Node.js
        uses: https://code.forgejo.org/actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: parchmark-web/ui/package-lock.json

      - name: Install dependencies
        run: make -C parchmark-web test-ui-install

      - name: Run linting
        run: make -C parchmark-web test-ui-lint

      - name: Run tests
        run: make -C parchmark-web test-ui-test

  backend-tests:
    runs-on: ubuntu-latest
    name: Backend Tests
    env:
      DOCKER_HOST: tcp://localhost:2375
      TESTCONTAINERS_RYUK_DISABLED: "true"
    strategy:
      matrix:
        python-version: ["3.14"]

    steps:
      - name: Checkout code
        uses: https://code.forgejo.org/actions/checkout@v4

      - name: Install uv
        uses: https://github.com/astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "parchmark-web/backend/pyproject.toml"

      - name: Setup Python with uv
        run: |
          cd parchmark-web/backend
          uv python install ${{ matrix.python-version }}
          uv python pin ${{ matrix.python-version }}

      - name: Sync dependencies with uv
        run: make -C parchmark-web test-backend-install

      - name: Run ruff linting check
        run: make -C parchmark-web test-backend-lint

      - name: Run ruff formatting check
        run: make -C parchmark-web test-backend-format

      - name: Run type checking
        run: make -C parchmark-web test-backend-types

      - name: Run tests with coverage
        run: make -C parchmark-web test-backend-pytest-limited

  mcp-tests:
    runs-on: ubuntu-latest
    name: MCP Tests

    steps:
      - name: Checkout code
        uses: https://code.forgejo.org/actions/checkout@v4

      - name: Install uv
        uses: https://github.com/astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "parchmark-mcp/uv.lock"

      # parchmark-mcp declares requires-python >=3.11; CI runs the monorepo
      # runtime (3.14), the same version the backend job pins.
      - name: Setup Python with uv
        run: |
          cd parchmark-mcp
          uv python install 3.14
          uv python pin 3.14

      - name: Sync dependencies with uv
        run: cd parchmark-mcp && uv sync --all-extras --frozen

      - name: Run ruff linting check
        run: cd parchmark-mcp && uv run ruff check src/ tests/

      - name: Run ruff formatting check
        run: cd parchmark-mcp && uv run ruff format --check src/ tests/

      - name: Run type checking
        run: cd parchmark-mcp && uv run pyright src/ tests/

      - name: Run tests
        run: cd parchmark-mcp && uv run pytest tests/ -q
